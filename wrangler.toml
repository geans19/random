# Yang wajib diisi
# 1. nama worker (ubah juga di Cargo.toml)
# 2. account id cloudflare
# 3. KV Storage
# 4. id KV Storage tadi
# 5. UUID

# ===============[ nama worker ]=================
name = "random"
main = "build/worker/shim.mjs"
compatibility_date = "2024-05-23"
minify = true

# ===============[ account id ]==================
account_id = "a63efbb33899af988ab54225ab82e18c"
workers_dev = true

# ===============[ KV STORAGE ]==================
[[kv_namespaces]]
binding = "AIO"
id = "f1f2f8b3eeeb492bade6671d75781b9b"

[build]
command = "cargo install worker-build && worker-build --release"

[env.dev]
build = { command = "cargo install worker-build && worker-build --dev" }

# =================[ UUID V4 ]===================
[vars]
UUID = "65c23062-5aad-4002-a56c-98bdc410a654"
MAIN_PAGE_URL = "https://raw.githubusercontent.com/geans19/random/refs/heads/main/web/index.html"
SUB_PAGE_URL = "https://raw.githubusercontent.com/geans19/random/refs/heads/main/web/sub.html"

